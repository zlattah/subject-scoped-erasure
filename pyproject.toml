[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-dedup"
version = "0.1.0"
description = "FastCDC plus RAD-CDC cut-migration prototype"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cascade-dedup = "cascade_dedup.__main__:main"

[tool.setuptools.packages.find]
include = ["cascade_dedup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
